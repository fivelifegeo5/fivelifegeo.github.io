<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Mint 5LIFE FINAL</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stellar-sdk/12.1.0/stellar-sdk.min.js"></script>
</head>
<body style="font-family:sans-serif;padding:20px;max-width:500px;margin:auto">
<h2>Mint 5LIFE FINAL</h2>
<p>Issuer: GC7A6N7MAOU52RVRCIO7BADA24CHKYVG77IOBXNAGU2UVM7P2S3KDSMT</p>
<p>Receiver: GD3OIJAV677OHQDZ25QXVDMWAD3AKJ6CGBMXKXZLGTBVUFC4TN2EX2BS</p>

<input id="amt" value="1000000" style="width:100%;padding:12px;margin-bottom:5px"><br>
<input id="sec" placeholder="SECRET KEY ng ISSUER (GC7A...)" style="width:100%;padding:12px;margin-bottom:5px"><br>
<input id="userSec" placeholder="SECRET KEY ng RECEIVER (GD3O...) pang trustline lang" style="width:100%;padding:12px;margin-bottom:10px"><br>

<button onclick="doTrustline()" style="width:100%;padding:12px;background:#000;color:white;border:none;border-radius:10px;margin-bottom:10px">STEP 1: ADD TRUSTLINE (Receiver)</button>
<button onclick="doMint()" style="width:100%;padding:12px;background:#6f42c1;color:white;border:none;border-radius:10px">STEP 2: MINT & SEND (Issuer)</button>

<div id="log" style="margin-top:15px;background:#f5f5f5;padding:10px;border-radius:10px;font-size:12px;white-space:pre-wrap"></div>

<script>
const server = new StellarSdk.Horizon.Server('https://api.testnet.minepi.com');
const issuer = 'GC7A6N7MAOU52RVRCIO7BADA24CHKYVG77IOBXNAGU2UVM7P2S3KDSMT';
const receiver = 'GD3OIJAV677OHQDZ25QXVDMWAD3AKJ6CGBMXKXZLGTBVUFC4TN2EX2BS';

async function doTrustline(){
  let sec = document.getElementById('userSec').value.trim();
  let log = document.getElementById('log');
  if(!sec.startsWith('S')){log.innerText='Lagay mo Receiver Secret (GD3O...) na S...';return;}
  try{
    log.innerText='Adding Trustline para sa '+receiver+'...';
    const kp = StellarSdk.Keypair.fromSecret(sec);
    const acc = await server.loadAccount(kp.publicKey());
    const asset = new StellarSdk.Asset('5LIFE', issuer);
    const tx = new StellarSdk.TransactionBuilder(acc,{fee:'100000',networkPassphrase:'Pi Testnet'})
      .addOperation(StellarSdk.Operation.changeTrust({asset:asset}))
      .setTimeout(60).build();
    tx.sign(kp);
    const res = await server.submitTransaction(tx);
    log.innerText='✅ TRUSTLINE OK! Hash: '+res.hash+'\nMakikita mo na 5LIFE sa wallet mo. Pwede ka na mag MINT.';
  }catch(e){log.innerText='❌ Trustline Error: '+(e.response?JSON.stringify(e.response.data,null,2):e.message);}
}

async function doMint(){
  let sec = document.getElementById('sec').value.trim();
  let amt = document.getElementById('amt').value.trim();
  let log = document.getElementById('log');
  if(!sec.startsWith('S')){log.innerText='Lagay mo Issuer Secret (GC7A...) na S...';return;}
  try{
    log.innerText='Minting '+amt+' 5LIFE to '+receiver+'...';
    const issuerKp = StellarSdk.Keypair.fromSecret(sec);
    const acc = await server.loadAccount(issuerKp.publicKey());
    const asset = new StellarSdk.Asset('5LIFE', issuer);
    const tx = new StellarSdk.TransactionBuilder(acc,{fee:'100000',networkPassphrase:'Pi Testnet'})
      .addOperation(StellarSdk.Operation.payment({destination: receiver, asset:asset, amount:amt}))
      .setTimeout(60).build();
    tx.sign(issuerKp);
    const res = await server.submitTransaction(tx);
    log.innerText='✅ SUCCESS '+amt+' 5LIFE MINTED to '+receiver+'!\nHash: '+res.hash+'\n\nCheck mo na Pi Wallet mo!';
  }catch(e){log.innerText='❌ Mint Error: '+(e.response?JSON.stringify(e.response.data,null,2):e.message);}
}
</script>
</body>
</html>
